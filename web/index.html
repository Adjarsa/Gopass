<title>Gopass — Un seul pass. Tous vos studios.</title>
<meta name="description" content="Gopass : un seul abonnement pour réserver vos cours de sport et de bien-être dans tous les studios partenaires, partout en Algérie.">

<style>
/* Idée de mise en page : application de réservation claire et colorée ; chaque discipline a sa teinte et son pictogramme. */
:root{
  color-scheme:light;
  --ground:#FBFAF7; --surface:#FFFFFF; --ink:#12263A; --muted:#4B5B6B; --line:#E4E7EA;
  --accent:#FF6B35; --accent-soft:#FFE7DC; --teal:#0E8F82; --red:#B42318;
  --display:'Bricolage Grotesque','Tajawal',system-ui,sans-serif;
  --body:'DM Sans','Tajawal',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(18,38,58,.05),0 10px 28px rgba(18,38,58,.08);
  --r:22px;
}
.d-pilates{--tint:#E3F6C4;--deep:#2C5410}.d-yoga{--tint:#FFE3CC;--deep:#7A3E0C}.d-barre{--tint:#FBD9E6;--deep:#7A1F45}.d-boxe{--tint:#FFD8D1;--deep:#8A2414}
.d-danse{--tint:#E6DEFF;--deep:#3D2A8C}.d-natation{--tint:#D2ECFF;--deep:#0B4A78}.d-cross{--tint:#FFEEB8;--deep:#6B4E00}.d-stretching{--tint:#D4F3EA;--deep:#0F5A47}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--ground);line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.brand,.big{font-family:var(--display);text-wrap:balance}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
a{color:var(--teal)}
svg{flex:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.dark :focus-visible{outline-color:#fff}
main:focus{outline:none}
main>*{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
header.top{position:sticky;top:0;z-index:10;background:rgba(251,250,247,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{font-weight:800;font-size:26px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.dot{width:26px;height:26px;border-radius:9px;background:var(--accent);box-shadow:inset 0 0 0 6px var(--accent),inset 0 0 0 9px #fff;transform:rotate(-8deg)}
nav.main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px}
nav.main a.link{text-decoration:none;font-weight:600;color:var(--muted);padding:10px 14px;border-radius:999px}
nav.main a.link:hover{background:#fff;color:var(--ink)}
nav.main a.link[aria-current="page"]{background:var(--ink);color:#fff}
.langs{display:flex;gap:2px;padding:3px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.langs button{min-width:44px;height:38px;padding:0 10px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;font-weight:700;font-size:16px;min-height:48px;padding:10px 22px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-family:inherit;background:#fff;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.small{min-height:44px;font-size:15px;padding:8px 16px}
.btn.danger{color:var(--red);border-color:#F3C9C4;background:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.page{padding-block:36px 72px;display:flex;flex-direction:column;gap:28px}
.eyebrow{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink);background:var(--accent-soft);padding:6px 14px;border-radius:999px}
h1{font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:1.05;letter-spacing:-.02em}
h2{font-weight:700;font-size:clamp(24px,3.2vw,36px);line-height:1.15;letter-spacing:-.01em}
h3{font-weight:700;font-size:20px;line-height:1.25}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .brand{letter-spacing:0}
html[lang="ar"] h1{line-height:1.25}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.hero>div{flex:1 1 380px;min-width:0}
.hero-copy{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.art{position:relative;height:420px;max-width:520px;margin-inline:auto;width:100%}
.art .blob{position:absolute;border-radius:50%}
.art .b1{width:300px;height:300px;background:var(--accent-soft);top:30px;inset-inline-start:8%}
.art .b2{width:150px;height:150px;background:#D2ECFF;bottom:0;inset-inline-end:4%}
.art .b3{width:70px;height:70px;background:#E3F6C4;top:6px;inset-inline-end:22%}
.art .tile{position:absolute;width:112px;height:112px;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.art .t1{top:18px;inset-inline-start:0;transform:rotate(-9deg)}
.art .t2{top:150px;inset-inline-end:0;transform:rotate(8deg)}
.art .t3{bottom:10px;inset-inline-start:6%;transform:rotate(6deg)}
.art .t4{bottom:36px;inset-inline-end:14%;transform:rotate(-7deg);width:92px;height:92px;border-radius:24px}
.phone{position:absolute;top:24px;left:50%;transform:translateX(-50%) rotate(-3deg);width:214px;background:var(--ink);border-radius:34px;padding:10px;box-shadow:0 24px 50px rgba(18,38,58,.28)}
.phone-in{background:#fff;border-radius:26px;padding:16px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink)}
.phone-in b{font-family:var(--display);font-size:17px}
.phone-in .pq{width:132px;height:132px}
.phone-in .pq svg{width:100%;height:100%;display:block}
.phone-in .pc{font-weight:800;letter-spacing:.08em;font-size:16px;direction:ltr}
.phone-in .pl{height:10px;border-radius:5px;background:var(--line);width:100%}
.phone-in .pl.s{width:62%}
.phone-in .pb{width:100%;height:36px;border-radius:999px;background:var(--accent)}
.tile{background:var(--tint);color:var(--deep)}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.badge.ink{background:var(--ink);color:#fff}
.badge.line{background:#fff;border:1px solid var(--line)}
.badge.on{background:#fff;color:var(--deep)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card.lift{transition:transform .18s ease,box-shadow .18s ease}
.card.lift:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(18,38,58,.06),0 18px 40px rgba(18,38,58,.13)}
.card.pic{padding:0;overflow:hidden}
.cover{height:118px;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cover .pictos{display:flex;gap:6px;align-self:flex-end;margin-inline-start:auto}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card.soft{background:var(--surface)}
.card.rec{border:2px solid var(--accent);background:linear-gradient(#fff,#fff) padding-box}
.card .foot{margin-top:auto;padding-top:6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.price{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap}
.big{font-weight:800;font-size:40px;line-height:1.05}
.ico{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--ink)}
.step-n{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tiles button{border:0;border-radius:var(--r);padding:18px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:10px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-align:start;transition:transform .18s ease,box-shadow .18s ease}
.tiles button:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:var(--shadow)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;min-width:0}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid #C9D0D6;background:#fff;font:inherit;font-size:16px;color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.field textarea{min-height:120px;resize:vertical}
/* Dans un formulaire en colonne, la base de 180px deviendrait une hauteur : on la neutralise. */
form.stack .field,.dform .field{flex:0 0 auto}
form.stack{display:flex;flex-direction:column;gap:14px;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
form.cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;color:var(--muted)}
.band{background:#fff;border-block:1px solid var(--line)}
.band.green{background:var(--ink);color:#fff;border:0}
.band.green .muted{color:#C6D0DA}
.band.green .tile{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.sec{padding-block:56px;display:flex;flex-direction:column;gap:26px}
.notice{padding:14px 16px;border-radius:16px;background:var(--accent-soft);font-size:15px}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:36px 20px;background:#fff;border:1px dashed #C9D0D6;border-radius:var(--r);color:var(--muted)}
.empty .tile{width:84px;height:84px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.ok{color:var(--teal);font-weight:700}
.err{color:var(--red);font-weight:700}
.stat{display:flex;flex-wrap:wrap;gap:16px}
.stat>div{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.15;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.item>.tile{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.item>.grow{flex:1 1 220px;min-width:0}
details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 18px;margin-bottom:10px}
summary{font-family:var(--display);font-weight:700;font-size:18px;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:24px;font-weight:500;color:var(--accent)}
details[open] summary::after{content:"–"}
details p{padding-bottom:14px;color:var(--muted)}
footer{background:var(--ink);color:#fff}
footer .wrap{padding-block:36px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px}
footer nav{display:flex;flex-wrap:wrap;gap:4px 22px}
footer a{color:#fff;padding:10px 0;display:inline-block}
footer p{font-size:14px;color:#C6D0DA;flex:1 1 100%}
dialog{border:0;border-radius:28px;padding:24px;max-width:min(440px,calc(100vw - 32px));width:100%;color:var(--ink);background:#fff;box-shadow:0 30px 80px rgba(18,38,58,.35)}
dialog::backdrop{background:rgba(18,38,58,.55)}
dialog .body{display:flex;flex-direction:column;gap:14px}
.qr{align-self:center;width:220px;height:220px;background:#fff;border-radius:18px;border:1px solid var(--line);padding:6px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}
.code{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.08em;text-align:center;direction:ltr}
#toast{position:fixed;inset-inline:16px;bottom:16px;display:flex;justify-content:center;pointer-events:none;z-index:30}
#toast div{background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;max-width:520px;box-shadow:var(--shadow)}
#toast div:empty{display:none}
.field.wide{flex:1 1 100%}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-size:14px;font-weight:700;padding:0;margin-bottom:6px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px;border:1px solid #C9D0D6;border-radius:999px;font-weight:600;font-size:15px;background:#fff;cursor:pointer}
.checks input{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent)}
.dform{display:flex;flex-direction:column;gap:12px}
[hidden]{display:none !important}
.planner{overflow-x:auto;padding-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(148px,1fr));gap:10px}
.day{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day h3{font-size:15px;text-transform:capitalize}
.slot{border:0;border-radius:14px;padding:10px 12px;text-align:start;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--tint);color:var(--deep);min-height:44px;transition:transform .15s ease}
.slot:hover{transform:translateY(-2px)}
.slot .small{color:inherit;font-size:13px}
.slot .tm{font-weight:800}
.slot.off{background:#EEF0F2;color:var(--muted)}
.slot.off b{text-decoration:line-through}
.tablebox{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted)}
td.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
form.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
form.inline input{min-height:44px;padding:6px 10px;border-radius:12px;border:1px solid #C9D0D6;font:inherit;font-size:15px;width:140px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tabbar{display:none}
@media (max-width:760px){
  nav.main a.link{display:none}
  header.top{position:static}
  header.top .wrap{padding-block:8px}
  .brand{font-size:22px}
  nav.main .btn.small{min-height:44px;padding:6px 12px;font-size:14px}
  form.stack{padding:18px}
  .week{grid-template-columns:1fr}
  .page{padding-block:24px 48px}.sec{padding-block:40px}
  .art{height:360px;transform:scale(.9);transform-origin:top center;margin-bottom:-30px}
  body{padding-bottom:70px}
  #toast{bottom:84px}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;text-decoration:none;font-size:12px;font-weight:700;color:var(--muted);border-radius:14px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}main>*{animation:none}.btn,.card.lift,.tiles button{transition:none}}
</style>
</head>

async function api(method, path, body) {
  var res;
  try {
    res = await fetch("/api" + path, { method: method, credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw { status: 0, code: "eNet" }; }
  var data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    var code = data && typeof data.detail === "string" ? data.detail : (res.status === 422 ? "required" : "eNet");
    throw { status: res.status, code: code };
  }
  return data;
}
function errText(e) { var c = e && e.code; return K[c] ? t(c) : t("eNet"); }

};

PAGES.contact = function () {
  return '<div class="wrap page"><h1>' + t("contactTitle") + '</h1><form class="stack" data-form="contact" novalidate>' + field("m-name", t("name"), 'name="name" autocomplete="given-name"') +
    field("m-email", t("email"), 'name="email" type="email" dir="ltr" autocomplete="email"') +
    '<div class="field"><label for="m-msg">' + t("msg") + '</label><textarea id="m-msg" name="message"></textarea></div><button class="btn dark" type="submit">' + t("send") + "</button>" + note("contact") + "</form></div>";
};

PAGES.confidentialite = function () {
  return '<div class="wrap page" style="max-width:820px"><h1>' + t("nPrivacy") + '</h1><ul class="list"><li class="notice">' + t("pv1") + '</li><li class="notice">' + t("pv2") + '</li><li class="notice">' + t("pv3") + '</li><li class="notice">' + t("pv4") + "</li></ul></div>";
};

/* ================= Rendu ================= */
function renderChrome() {
  var r = route();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  function link(id, key) { return '<a class="link" href="#' + id + '"' + (r === id ? ' aria-current="page"' : "") + ">" + t(key) + "</a>"; }
  var acc;
  if (!D.me) { acc = '<a class="btn small dark" href="#compte">' + t("nLogin") + "</a>"; }
  else if (D.me.role === "member") { acc = '<a class="btn small' + (r === "compte" ? " dark" : "") + '" href="#compte">' + ico("coin", 20) + "<span><bdi>" + esc(D.me.name) + "</bdi> · <bdi>" + credits(D.me.credits) + "</bdi></span></a>"; }
  else { acc = '<a class="btn small dark" href="#' + (D.me.role === "admin" ? "admin" : "espace-studio") + '">' + ico("user", 20) + "<span><bdi>" + esc(D.me.name) + "</bdi></span></a>"; }
  var langs = '<div class="langs" role="group" aria-label="' + t("langLabel") + '">' + [["fr", "FR"], ["en", "EN"], ["ar", "عربي"]].map(function (l) {
    return '<button type="button" data-act="lang" data-id="' + l[0] + '" lang="' + l[0] + '" aria-pressed="' + (lang === l[0]) + '">' + l[1] + "</button>"; }).join("") + "</div>";
  var nav = document.getElementById("nav");
  nav.setAttribute("aria-label", t("navLabel"));
  nav.innerHTML = link("cours", "nClasses") + link("studios", "nStudios") + link("formules", "nPlans") + langs + acc;
  document.getElementById("foot").innerHTML = '<div><span class="brand" dir="ltr" style="color:#fff;min-height:0">gopass</span></div><nav aria-label="' + t("footLabel") + '">' +
    [["accueil", "nHome"], ["cours", "nClasses"], ["studios", "nStudios"], ["formules", "nPlans"], ["espace-studio", "nStudioSpace"], ["faq", "nFaq"], ["contact", "nContact"], ["confidentialite", "nPrivacy"]].map(function (x) {
      return '<a href="#' + x[0] + '">' + t(x[1]) + "</a>"; }).join("") + "</nav><p>" + t("rights") + "</p>";
  var tb = document.getElementById("tabbar");
  tb.setAttribute("aria-label", t("navLabel"));
  tb.innerHTML = [["accueil", "nHome", "home"], ["cours", "nClasses", "cal"], ["studios", "nStudios", "pin"], ["compte", "nAccount", "user"]].map(function (x) {
    return '<a href="#' + x[0] + '"' + (r === x[0] ? ' aria-current="page"' : "") + ">" + ico(x[2], 22) + "<span>" + t(x[1]) + "</span></a>"; }).join("");
  document.title = "Gopass — " + t("tagline");
}
function render(isNav) {
  renderChrome();
  var app = document.getElementById("app");
  app.innerHTML = D.ready ? PAGES[route()]() : '<div class="wrap page"><p class="notice">' + t("loading") + "</p></div>";
  if (isNav) { window.scrollTo(0, 0); try { app.focus({ preventScroll: true }); } catch (e) {} }
}
/* Charge ce dont la page a besoin, puis l'affiche. */
async function show(isNav) {
  var r = route();
  try {
    if (r === "espace-studio" && D.me && D.me.role === "studio") { await loadDash(); }
    if (r === "admin" && D.me && D.me.role === "admin") { await loadAdmin(); }
  } catch (e) { toast(errText(e)); }
  render(isNav);
}
async function reload() { await Promise.all([loadMe(), loadSessions()]); await show(false); }

/* ================= Actions ================= */
function confirmDlg(title, bodyHtml, act, id) {
  openDlg("<h2>" + title + "</h2>" + bodyHtml + '<div class="row"><button class="btn dark" data-act="' + act + '" data-id="' + id + '">' + t("confirm") + '</button><button class="btn" data-act="dlg-close">' + t("back") + "</button></div>");
}
async function run(fn, okText) {
  if (busy) { return; }
  busy = true;
  try { await fn(); if (okText) { toast(okText); } }
  catch (e) { toast(errText(e)); }
  finally { busy = false; }
}
var ACT = {
  lang: function (id) { lang = id; try { localStorage.setItem("gopass-lang", id); } catch (e) {} if (D.me) { api("PATCH", "/me", { lang: id }).catch(function () {}); } render(false); },
  disc: function (id) { F = { city: "", disc: id, day: "", studio: "" }; go("cours"); },
  "studio-classes": function (id) { F = { city: "", disc: "", day: "", studio: id }; go("cours"); },
  "clear-studio": function () { F.studio = ""; render(false); },
  "auth-mode": function () { AUTH = AUTH === "register" ? "login" : "register"; formMsg = {}; render(false); },
  logout: function () { run(async function () { await api("POST", "/auth/logout"); D.me = null; D.dash = null; D.adm = null; D.members = null; await loadSessions(); go("accueil"); }); },
  book: function (id) {
    var c = D.sessions.filter(function (x) { return String(x.id) === String(id); })[0]; if (!c) { return; }
    if (!D.me) { toast(t("needAccount")); go("compte"); return; }
    if (!isMember()) { toast(t("forbidden")); return; }
    if (D.me.credits < c.credits) { toast(t("needCredits")); go("formules"); return; }
    confirmDlg(t("confirmBook"), "<p><b>" + esc(c.title) + "</b><br>" + esc(c.studio) + "<br>" + esc(fmtDay(dateOf(c.start))) + ' · <span dir="ltr">' + timeOf(c.start) + "</span></p><p>" + t("cost") + " <b>" + credits(c.credits) + "</b><br>" + t("after") + " <b>" + credits(D.me.credits - c.credits) + '</b></p><p class="small">' + t("cancelRule").replace("12", D.cfg.cancel_hours || 12) + "</p>", "book-yes", c.id);
  },
  "book-yes": function (id) { closeDlg(); run(async function () { try { D.me = await api("POST", "/bookings", { session_id: Number(id) }); } finally { await loadSessions(); render(false); } }, t("bookedOk")); },
  ticket: function (id) {
    var b = D.me.bookings.filter(function (x) { return String(x.id) === String(id); })[0]; if (!b) { return; }
    var q = qrSvg("GOPASS:" + b.code);
    openDlg("<h2>" + t("ticketTitle") + "</h2>" + (q ? '<div class="qr" role="img" aria-label="QR code ' + esc(b.code) + '">' + q + "</div>" : '<p class="notice">' + t("qrMissing") + "</p>") + '<p class="code">' + esc(b.code) + "</p><p><b>" + esc(b.title) + "</b><br>" + esc(b.studio) + "<br>" + esc(fmtDay(dateOf(b.start))) + ' · <span dir="ltr">' + timeOf(b.start) + '</span></p><p class="small">' + t("ticketP") + '</p><button class="btn dark" data-act="dlg-close">' + t("close") + "</button>");
  },
  cancel: function (id) {
    var b = D.me.bookings.filter(function (x) { return String(x.id) === String(id); })[0]; if (!b) { return; }
    confirmDlg(t("cancelTitle"), "<p><b>" + esc(b.title) + "</b></p><p>" + (b.refundable ? t("refundYes") + " <b>" + credits(b.credits) + "</b>" : t("refundNo").replace("12", D.cfg.cancel_hours || 12)) + "</p>", "cancel-yes", b.id);
  },
  "cancel-yes": function (id) { closeDlg(); run(async function () { D.me = await api("POST", "/bookings/" + id + "/cancel"); await loadSessions(); render(false); }, t("cancelOk")); },
  plan: function (id) {
    if (!D.me) { toast(t("needAccount")); go("compte"); return; }
    if (!isMember()) { toast(t("forbidden")); return; }
    if (!D.cfg.online_payment) { toast(t("ePayOff")); return; }
    var p = D.plans.filter(function (x) { return String(x.id) === String(id); })[0]; if (!p) { return; }
    confirmDlg(esc(tr(p.name)), "<p><b>" + credits(p.credits) + "</b> · " + money(p.price) + "</p><p>" + t("confirmPay") + "</p>", "plan-yes", p.id);
  },
  "plan-yes": function (id) { closeDlg(); run(async function () { var r = await api("POST", "/payments/checkout", { plan_id: Number(id) }); location.href = r.url; }); },
  "del-account": function () { confirmDlg(t("delAccount"), "<p>" + t("delQ") + "</p>", "del-yes", ""); },
  "del-yes": function () { closeDlg(); run(async function () { await api("DELETE", "/me"); D.me = null; await loadSessions(); go("accueil"); }, t("delOk")); },
  slot: function (id) {
    var c = D.dash.sessions.filter(function (x) { return String(x.id) === String(id); })[0]; if (!c) { return; }
    openDlg("<h2>" + t("slotTitle") + "</h2><p><b>" + esc(c.title) + "</b><br>" + esc(fmtDay(dateOf(c.start))) + ' · <span dir="ltr">' + timeOf(c.start) + "</span><br>" + (c.recurring ? t("recurring") : t("once")) + " · " + credits(c.credits) + "</p>" +
      '<form class="dform" data-form="slot" data-id="' + c.id + '" novalidate><div class="field"><label for="s-spots">' + t("gSpots") + '</label><input id="s-spots" name="spots" type="number" min="1" max="' + c.capacity + '" value="' + c.spots + '"><span class="small">' + t("capIs") + " " + c.capacity + " · " + t("bookedCount") + " " + c.taken + '</span></div><p class="err" id="slotErr" role="status"></p>' +
      '<button class="btn dark" type="submit">' + t("save") + '</button></form><div class="row"><button class="btn small danger" data-act="remove" data-id="' + c.id + '">' + t("cancelSlot") + '</button><button class="btn small" data-act="dlg-close">' + t("back") + "</button></div>");
  },
  remove: function (id) { confirmDlg(t("confirmRemove"), "<p>" + t("removeQ") + "</p>", "remove-yes", id); },
  "remove-yes": function (id) { closeDlg(); run(async function () { await api("POST", "/studio/sessions/" + id + "/cancel"); await show(false); }, t("removed")); },
  restore: function (id) { run(async function () { await api("POST", "/studio/sessions/" + id + "/restore"); await show(false); }, t("restored")); },
  "series-del": function (id) { confirmDlg(t("seriesDel"), "<p>" + t("seriesQ") + "</p>", "series-del-yes", id); },
  "series-del-yes": function (id) { closeDlg(); run(async function () { await api("DELETE", "/studio/series/" + id); await show(false); }, t("seriesGone")); },
  "adm-studio": function (id, el) { run(async function () { await api("PATCH", "/admin/studios/" + id, { active: el.getAttribute("data-on") === "1" }); await loadPublic(); await show(false); }, "Studio mis à jour."); },
  "adm-handled": function (id) { var p = id.split(":"); run(async function () { await api("POST", "/admin/handled", { kind: p[0], id: Number(p[1]) }); await show(false); }); },
  "dlg-close": function () { closeDlg(); }
};

var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function val(form, name) { var el = form.elements[name]; return el ? (el.value || "").trim() : ""; }
function num(form, name) { return parseInt(val(form, name), 10); }
function bad(key) { return { ok: false, text: t(key) }; }
/* Chaque formulaire renvoie {ok, text} à afficher, ou rien. `key` est l'emplacement du message. */
var FORMS = {
  signup: { key: "auth", run: async function (f) {
    var name = val(f, "name"), email = val(f, "email").toLowerCase(), pw = f.elements.password.value;
    if (!name) { return bad("required"); } if (!EMAIL_RE.test(email)) { return bad("badEmail"); } if (pw.length < 8) { return bad("eShortPw"); }
    D.me = await api("POST", "/auth/register", { name: name, email: email, password: pw, lang: lang }); await loadSessions();
  } },
  login: { key: "auth", run: async function (f) {
    var email = val(f, "email").toLowerCase(), pw = f.elements.password.value;
    if (!EMAIL_RE.test(email) || !pw) { return bad("eLogin"); }
    try { D.me = await api("POST", "/auth/login", { email: email, password: pw }); }
    catch (e) { if (e.status === 422) { return bad("eLogin"); } throw e; }
    await loadSessions();
    if (D.me.role === "studio") { location.hash = "espace-studio"; } else if (D.me.role === "admin") { location.hash = "admin"; }
  } },
  partner: { key: "partner", run: async function (f) {
    var b = { name: val(f, "name"), city: val(f, "city"), email: val(f, "email").toLowerCase(), disciplines: val(f, "disciplines") };
    if (b.name.length < 2 || b.city.length < 2 || b.disciplines.length < 2) { return bad("required"); } if (!EMAIL_RE.test(b.email)) { return bad("badEmail"); }
    await api("POST", "/applications", b); return { ok: true, text: t("sentPartner") };
  } },
  contact: { key: "contact", run: async function (f) {
    var b = { name: val(f, "name"), email: val(f, "email").toLowerCase(), message: val(f, "message") };
    if (!b.name || b.message.length < 2) { return bad("required"); } if (!EMAIL_RE.test(b.email)) { return bad("badEmail"); }
    await api("POST", "/contact", b); return { ok: true, text: t("sent") };
  } },
  checkin: { key: "checkin", run: async function (f) {
    var code = val(f, "code"); if (code.length < 3) { return bad("checkNo"); }
    var r = await api("POST", "/studio/checkin", { code: code }); return { ok: true, text: t("checkOk") + " " + r.name + " — " + r.title };
  } },
  addclass: { key: "addclass", run: async function (f) {
    var b = { title: val(f, "title"), discipline: val(f, "discipline"), time: val(f, "time"), duration: num(f, "duration"), capacity: num(f, "capacity"), spots: num(f, "spots"), reference_price: num(f, "reference_price") };
    if (b.title.length < 2) { return bad("required"); }
    if (!/^\d\d:\d\d$/.test(b.time) || !(b.duration >= 15 && b.duration <= 180) || !(b.capacity >= 1) || !(b.spots >= 1) || !(b.reference_price >= 100)) { return bad("badClass"); }
    if (b.spots > b.capacity) { return bad("badCap"); }
    if (val(f, "mode") === "weekly") {
      b.days = []; var boxes = f.querySelectorAll('input[name="day"]:checked'); for (var i = 0; i < boxes.length; i++) { b.days.push(+boxes[i].value); }
      if (!b.days.length) { return bad("badDays"); }
      await api("POST", "/studio/series", b); return { ok: true, text: t("addedRec") };
    }
    b.date = val(f, "date"); if (!b.date) { return bad("badClass"); }
    await api("POST", "/studio/sessions", b); return { ok: true, text: t("added") };
  } },
  "adm-cash": { key: "adm-cash", run: async function (f) { var e = val(f, "email").toLowerCase(); if (!EMAIL_RE.test(e)) { return bad("badEmail"); } await api("POST", "/admin/payments/cash", { email: e, plan_id: num(f, "plan_id") }); D.members = null; return { ok: true, text: "Formule activée pour " + e + "." }; } },
  "adm-studio": { key: "adm-studio", run: async function (f) {
    var b = {}; ["name", "city", "area", "description", "manager_name", "manager_email", "manager_password"].forEach(function (k) { b[k] = val(f, k); });
    if (b.name.length < 2 || b.city.length < 2 || !b.manager_name || !EMAIL_RE.test(b.manager_email) || b.manager_password.length < 8) { return { ok: false, text: "Vérifiez les champs : e-mail valide et mot de passe d'au moins 8 caractères." }; }
    await api("POST", "/admin/studios", b); await loadPublic(); return { ok: true, text: "Studio créé. Transmettez l'e-mail et le mot de passe au gérant." };
  } },
  "adm-plan": { key: "adm-plan", run: async function (f) {
    var b = {}; ["name_fr", "name_en", "name_ar", "desc_fr", "desc_en", "desc_ar"].forEach(function (k) { b[k] = val(f, k); });
    b.credits = num(f, "credits"); b.price_dzd = num(f, "price_dzd"); b.is_active = val(f, "is_active") === "1"; b.sort = num(f, "sort") || 0;
    if (!b.name_fr || !b.name_en || !b.name_ar || !(b.credits >= 1) || !(b.price_dzd >= 100)) { return { ok: false, text: "Vérifiez les noms, les crédits et le prix." }; }
    await api("PUT", "/admin/plans/" + f.getAttribute("data-id"), b); await loadPublic(); return { ok: true, text: "Formule enregistrée." };
  } },
  "adm-credits": { key: "adm-credits", run: async function (f) { var c = num(f, "credits"); if (!(c >= 1)) { return { ok: false, text: "Nombre de crédits invalide." }; } await api("PATCH", "/admin/series/" + f.getAttribute("data-id"), { credits: c }); await loadSessions(); return { ok: true, text: "Prix en crédits mis à jour pour les séances à venir." }; } },
  "adm-adjust": { key: "adm-adjust", run: async function (f) { var d = num(f, "delta"), r = val(f, "reason"); if (!d || r.length < 3) { return { ok: false, text: "Indiquez un nombre de crédits et un motif." }; } await api("POST", "/admin/members/" + f.getAttribute("data-id") + "/credits", { delta: d, reason: r }); D.members = await api("GET", "/admin/members"); return { ok: true, text: "Crédits ajustés." }; } },
  "adm-search": { key: "adm-adjust", run: async function (f) { D.members = await api("GET", "/admin/members?q=" + encodeURIComponent(val(f, "q"))); } },
  "adm-statements": { key: "adm-statements", run: async function (f) { D.statements = await api("GET", "/admin/statements?month=" + encodeURIComponent(val(f, "month"))); } }
};

document.addEventListener("click", function (ev) {
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) { return; }
  var fn = ACT[el.getAttribute("data-act")];
  if (fn) { ev.preventDefault(); fn(el.getAttribute("data-id"), el); }
});
document.addEventListener("submit", async function (ev) {
  var f = ev.target, name = f.getAttribute("data-form");
  if (!name) { return; }
  ev.preventDefault();
  if (busy) { return; }
  if (name === "slot") {
    busy = true;
    try { await api("PATCH", "/studio/sessions/" + f.getAttribute("data-id"), { spots: num(f, "spots") }); closeDlg(); toast(t("saved")); await show(false); }
    catch (e) { document.getElementById("slotErr").textContent = errText(e); }
    finally { busy = false; }
    return;
  }
  var def = FORMS[name]; if (!def) { return; }
  formMsg = {}; busy = true;
  var res = null;
  try { res = await def.run(f); } catch (e) { res = { ok: false, text: errText(e) }; }
  busy = false;
  if (res) { formMsg[def.key] = res; }
  await show(false);
  if (res && !res.ok) { var again = document.querySelector('[data-form="' + name + '"]'); var first = again && again.querySelector("input, textarea"); if (first) { first.focus(); } }
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.hasAttribute("data-filter")) { F[el.getAttribute("data-filter")] = el.value; render(false); var again = document.getElementById(el.id); if (again) { again.focus(); } }
  else if (el.id === "c-mode") { var w = el.value === "weekly"; document.getElementById("c-days-box").hidden = !w; document.getElementById("c-date-box").hidden = w; }
});
dlg.addEventListener("click", function (ev) { if (ev.target === dlg) { closeDlg(); } });
window.addEventListener("hashchange", function () { formMsg = {}; closeDlg(); show(true); });

(async function start() {
  render(false);
  var paid = null;
  try { paid = new URLSearchParams(location.search).get("paiement"); if (paid) { history.replaceState(null, "", location.pathname + location.hash); } } catch (e) {}
  try { await Promise.all([loadPublic(), loadMe()]); } catch (e) { toast(errText(e)); }
  D.ready = true;
  await show(false);
  if (paid === "ok") { toast(t("payOk")); } else if (paid === "echec") { toast(t("payKo")); }
})();
})();
</script>
